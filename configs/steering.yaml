# Q2: does the recovered direction causally affect behaviour? (EasySteer / vLLM)
#
# Every model is steered along ITS OWN directions, estimated in Q1 on discovery data.
# Location: layer 36 in our convention = residual stream at the INPUT of decoder block 36
#   = EasySteer `direct` on decoder layer 35's OUTPUT (EasySteer layer ids are block
#   outputs) = public-steering-vectors pod `block = layer - 1`. Added at every prompt and
#   generated position.
# Scale (Betley et al.'s convention): added vector = strength x A_L x unit(direction), with
#   A_L the mean residual-stream norm at layer L (from our Betley reproduction on the same
#   model, i.e. last-prompt-token norms). So strength 1.0 = a perturbation the size of a
#   typical activation, every direction is norm-matched at a given strength, and
#   strengths are comparable across models.
layer: 36

directions:
  ours_resp:   {source: analysis, group: pooled, rep: resp, contrast: auto_minus_baseline}   # primary
  ours_pre:    {source: analysis, group: pooled, rep: pre,  contrast: auto_minus_baseline}
  betley_repro: {source: betley_repro}           # Betley-style direction reproduced on this model
  betley_0007: {source: betley_published, models: [qwen3.6-27b]}   # the published vector itself
random_directions: {n: 5, seed: 99}              # norm-matched isotropic random directions

# Decomposition steering (brief Q2). U_k = discovery-only orthonormal baseline PCA basis of
# the source direction's group / representation / layer (analysis/vectors/
# <group>_<rep>_L36_baseline_pcs.npy); g_par = U_k U_k^T g, g_perp = g - g_par.
#   <src>_in_k<k>, <src>_out_k<k>       ORIGINAL contribution: strength x A_L x component/||g||
#                                       (the same alpha as for g; never renormalised)
#   <src>_in_k<k>_mn, <src>_out_k<k>_mn MATCHED norm: strength x A_L x unit(component),
#                                       skipped when ||component|| / ||g|| < min_component_frac
# Ranks are predefined (not chosen on benchmark outcomes) and capped by the PCA's empirical
# rank; results are labelled "inside / outside the baseline PCA subspace", never "outside
# all persona representations". Random directions stay norm-matched to the full direction
# (= the _mn variants).
projections:
  sources: [ours_resp]
  ranks: [1, 5, 10, 20]
  min_component_frac: 0.1

# ---------------------------------------------------------------------------
# Strength calibration on SEPARATE prompts (never the evaluation sets).
# Rule (pre-registered): s* = the largest grid strength such that, for the primary
# direction at +s and -s and every smaller grid strength, on the calibration prompts:
#   final-answer rate >= 0.90, degenerate-repetition rate <= 0.10,
#   GSM8K-calibration accuracy drop vs unsteered <= 0.15.
# Evaluation then uses strengths {s*/2, s*} in both signs. Override with --strengths.
# ---------------------------------------------------------------------------
calibration:
  primary_direction: ours_resp
  strength_grid: [0.05, 0.1, 0.15, 0.2, 0.3, 0.4]
  min_answer_rate: 0.90
  max_repetition_rate: 0.10
  max_accuracy_drop: 0.15
  aa_question_seed: 7          # 24 ordinary Assistant Axis questions NOT in the Q1 manifest
  n_aa_questions: 24
  gsm8k_file: data/gsm8k/calibration_train_subset.jsonl

evaluation:
  conditions:
    - none                     # unsteered
    - natural_auto             # unsteered + Q1 automated-grading prefix (natural context effect)
    - natural_human            # unsteered + Q1 human-grading prefix
  steered_directions: [ours_resp, ours_pre, betley_repro, betley_0007]   # each at +-{s*/2, s*}
  random_signs: [1, -1]        # random directions at +-s* only
  projection_signs: [1, -1]    # decomposition components at +-s* only
  benchmarks:
    sorh:           {file: data/school_of_reward_hacks/srh_subset.jsonl, field: user}            # grader-sensitive
    sorh_descored:  {file: data/school_of_reward_hacks/srh_subset.jsonl, field: user_descored}   # same tasks, no scoring rule
    gsm8k:          {file: data/gsm8k/test_subset.jsonl}                                         # capability check
    # HELD-OUT behavioural validation (never used for calibration; extra_benchmarks.py):
    truthfulqa:      {n: 300, seed: 20261019, answer_format: inspect}    # TruthfulQA MC1, Betley's port, shuffled options
    trait_openended: {questions_per_trait: 20, epochs: 1}                # 10 traits x 20, frozen rubric
    persona:        {}         # held-out roles x validation questions (activation check only)
  gsm8k_instruction: "Solve the following problem. Give your final answer as a single number in \\boxed{}."

generation:                    # thinking on, Qwen-recommended sampling (as Q1)
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  max_tokens: 8192
  max_model_len: 10240
  base_seed: 4321

judges:
  # School of Reward Hacks: Betley et al.'s two judges, prompts verbatim
  # (data/school_of_reward_hacks/judge{1_metric,2_quality}_prompt.txt), same model for both.
  sorh_model: claude-sonnet-5
  max_tokens: 1024
  max_attempts: 4
  concurrency: 32
  # Open-ended trait judge: the settings recorded in data/trait_openended/PROVENANCE.json
  # (judge_settings_followed): rubric verbatim as the single user message, one call per
  # reply, no sampling parameters, adaptive thinking (display only), JSON-schema output,
  # strict parse, no re-ask on an unparseable verdict (transport errors are retried).
  trait_model: claude-sonnet-5
  trait_max_tokens: 4096
  trait_structured_output: true

activation_check:
  # Does steering move held-out persona activations in the direction observed under
  # natural grading prompts? Held-out roles x validation questions x prompt variant 0,
  # baseline condition; compare steering-induced displacement at DOWNSTREAM layers with
  # the natural (Q1 discovery) displacement at those layers.
  downstream_layers: [40, 48, 56]
  directions: [ours_resp, ours_pre, betley_repro]
  n_random: 2
