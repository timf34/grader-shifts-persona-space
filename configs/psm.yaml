# PSM decisions experiment (2026-10-26). Inference, activation analysis and steering only.
# Stage "pilot": discovery items only (assay validation, Track A discovery profiles, Track B
# layer/strength sweep). Stage "confirm": held-out items and families, frozen settings
# (section `frozen`, filled in after the pilot, before any confirmation data exist).
version: 1

personas_file: data/psm/personas_v1.json
vignettes_file: data/psm/vignettes_v1.jsonl

hf:
  layers: [16, 24, 32, 36, 40, 48]        # trait extraction + last-prompt-token activations
  save_acts_layers: [24, 32, 36, 40, 48]  # persona landscape on the assay prompts (float16)

steering:
  scale_source: betley_repro              # A_L = mean residual norm at L (Q2 convention): strength x A_L x unit
  random_seed: 99
  sweep:                                  # pilot, discovery items, default Assistant, base context
    layers: [32, 36, 40]
    strengths: [0.1, 0.2, 0.3]
    random: {n: 2, strengths: [0.2, 0.3]} # at every sweep layer, both signs
    samples: 2
  # Pre-registered selection rule (applied by scripts/psm/select_steering.py):
  # for each (layer L, strength s): range = misreport(+s) - misreport(-s) on discovery conflict
  # items (base context); valid iff valid-report rate >= 0.90 and control accuracy >= 0.85 at
  # both signs; random band = max |range| over random directions at layer L and strengths <= s.
  # Choose the valid (L, s) maximising range - band. Gate passed iff that excess > 0, range >= 0.10
  # and the item-bootstrap 95% CI of range excludes 0. If the gate fails, confirmation still runs
  # at the fallback (L 36, s 0.2) and is reported as a bounded negative result.
  select: {min_valid: 0.90, min_control_acc: 0.85, min_range: 0.10, fallback: {layer: 36, strength: 0.2}}

generation:                               # per model family, the settings established in this repo
  qwen:  {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 0.0,
          max_tokens: 8192, max_model_len: 12288, base_seed: 4321}
  olmo:  {temperature: 0.6, top_p: 0.95, top_k: -1, min_p: 0.0, presence_penalty: 0.0,
          max_tokens: 12288, max_model_len: 16384, base_seed: 4321}

pilot:
  track_a: {contexts: [base, auto, neutral], samples: 2, questionnaire_samples: 1}

confirm:
  track_a: {contexts: [base, auto, human, neutral], samples: 2, questionnaire_samples: 1,
            questionnaire_contexts: [base, auto, neutral],
            forced_choice: {contexts: [base, auto, neutral], dimensions: [honesty, rules_outcomes, risk],
                            samples: 2, format: constrained}}
  track_b: {contexts: [base, auto, neutral], samples: 2, random: {n: 3}}

frozen: null    # filled after the pilot (pressure levels kept, steering layer/strength per model)
